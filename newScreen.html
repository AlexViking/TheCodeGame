<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Code Game - Dynamic Background</title>
    <style>
        /* --- General Setup --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevent scrollbars */
            font-family: 'Press Start 2P', monospace; /* Use your game font */
            background-color: #1a1a2e; /* Dark background color matching your game */
        }

        /* --- Background Layer --- */
        #code-background {
            position: fixed; /* Keep it behind everything */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Much lighter overlay so symbols are visible */
            background-color: rgba(0, 0, 0, 0.1);
            z-index: 0; /* Behind main content but visible */
            perspective: 800px; /* For a slight 3D look on movement */
        }

        /* --- Main Content Layer --- */
        #game-content {
            position: relative;
            z-index: 100;
            text-align: center;
            padding-top: 15vh;
            color: #f39c12; /* Gold/Orange text color matching your game */
        }

        #game-content h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px #000;
        }

        #game-content .version {
            font-size: 0.6em;
            color: #95a5a6;
            margin-bottom: 5px;
        }

        #game-content .author {
            font-size: 0.6em;
            color: #95a5a6;
            margin-bottom: 40px;
        }

        #game-content .author a {
            color: #4ecca3;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        #game-content .author a:hover {
            color: #f39c12;
        }

        #game-content .level-card {
            background-color: #16213e;
            border: 4px solid #0f3460;
            padding: 30px 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            display: inline-block;
            margin: 20px;
        }

        #game-content .level-card:hover {
            border-color: #f39c12;
            transform: scale(1.05);
        }

        #game-content .level-card h3 {
            font-size: 1em;
            margin-bottom: 15px;
            color: #f39c12;
        }

        #game-content .level-card p {
            font-size: 0.6em;
            color: #4ecca3;
        }

        /* --- Simplified Symbol Container --- */
        .floating-symbols {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* --- Pixelated Symbol --- */
        .symbol {
            position: absolute;
            width: 24px;
            height: 24px;
            z-index: 10;
            animation: sparkle 4s ease-in-out infinite;
        }

        /* Pixelated HTML Symbol (<>) */
        .symbol.html {
            background:
                /* < shape */
                linear-gradient(#ff6b6b 0 0) 2px 6px/2px 2px,
                linear-gradient(#ff6b6b 0 0) 4px 8px/2px 2px,
                linear-gradient(#ff6b6b 0 0) 6px 10px/2px 2px,
                linear-gradient(#ff6b6b 0 0) 4px 12px/2px 2px,
                linear-gradient(#ff6b6b 0 0) 2px 14px/2px 2px,
                /* > shape */
                linear-gradient(#ff6b6b 0 0) 16px 6px/2px 2px,
                linear-gradient(#ff6b6b 0 0) 14px 8px/2px 2px,
                linear-gradient(#ff6b6b 0 0) 12px 10px/2px 2px,
                linear-gradient(#ff6b6b 0 0) 14px 12px/2px 2px,
                linear-gradient(#ff6b6b 0 0) 16px 14px/2px 2px;
            background-repeat: no-repeat;
        }

        /* Pixelated CSS Symbol ({}) */
        .symbol.css {
            background:
                /* { shape */
                linear-gradient(#4ecdc4 0 0) 4px 4px/2px 2px,
                linear-gradient(#4ecdc4 0 0) 2px 6px/2px 2px,
                linear-gradient(#4ecdc4 0 0) 4px 8px/2px 2px,
                linear-gradient(#4ecdc4 0 0) 2px 10px/2px 2px,
                linear-gradient(#4ecdc4 0 0) 4px 12px/2px 2px,
                linear-gradient(#4ecdc4 0 0) 2px 14px/2px 2px,
                linear-gradient(#4ecdc4 0 0) 4px 16px/2px 2px,
                /* } shape */
                linear-gradient(#4ecdc4 0 0) 14px 4px/2px 2px,
                linear-gradient(#4ecdc4 0 0) 16px 6px/2px 2px,
                linear-gradient(#4ecdc4 0 0) 14px 8px/2px 2px,
                linear-gradient(#4ecdc4 0 0) 16px 10px/2px 2px,
                linear-gradient(#4ecdc4 0 0) 14px 12px/2px 2px,
                linear-gradient(#4ecdc4 0 0) 16px 14px/2px 2px,
                linear-gradient(#4ecdc4 0 0) 14px 16px/2px 2px;
            background-repeat: no-repeat;
        }

        /* Pixelated JS Symbol (()) */
        .symbol.js {
            background:
                /* ( shape */
                linear-gradient(#ffe66d 0 0) 6px 4px/2px 2px,
                linear-gradient(#ffe66d 0 0) 4px 6px/2px 2px,
                linear-gradient(#ffe66d 0 0) 4px 8px/2px 2px,
                linear-gradient(#ffe66d 0 0) 4px 10px/2px 2px,
                linear-gradient(#ffe66d 0 0) 4px 12px/2px 2px,
                linear-gradient(#ffe66d 0 0) 4px 14px/2px 2px,
                linear-gradient(#ffe66d 0 0) 6px 16px/2px 2px,
                /* ) shape */
                linear-gradient(#ffe66d 0 0) 12px 4px/2px 2px,
                linear-gradient(#ffe66d 0 0) 14px 6px/2px 2px,
                linear-gradient(#ffe66d 0 0) 14px 8px/2px 2px,
                linear-gradient(#ffe66d 0 0) 14px 10px/2px 2px,
                linear-gradient(#ffe66d 0 0) 14px 12px/2px 2px,
                linear-gradient(#ffe66d 0 0) 14px 14px/2px 2px,
                linear-gradient(#ffe66d 0 0) 12px 16px/2px 2px;
            background-repeat: no-repeat;
        }

        /* --- Random Sparkle Animation --- */
        @keyframes sparkle {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            20% {
                opacity: 0.8;
                transform: scale(1);
            }
            80% {
                opacity: 0.8;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.5);
            }
        }

        /* --- Pulse effect for occasional emphasis --- */
        @keyframes pulse {
            0%, 100% {
                opacity: 0.8;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .symbol.pulse {
            animation: sparkle 4s ease-in-out infinite, pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <div id="code-background">
        <div class="floating-symbols" id="floating-symbols">
        </div>
    </div>

    <div id="game-content">
        <h1>THE CODE GAME</h1>
        <p class="version">Version: 1.0.1</p>
        <p class="author">Author: <a href="https://github.com/AleksandreKhundzakishvili" target="_blank" rel="noopener">Aleksandre Khundzakishvili</a></p>

        <div class="level-card">
            <h3>HTML BASICS</h3>
            <p>Master the structure of the web</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('floating-symbols');

            const symbolTypes = ['html', 'css', 'js'];
            let symbolCount = 0;
            const maxSymbols = 12; // Exactly 12 symbols max

            function createSymbol() {
                // Don't create too many symbols
                if (symbolCount >= maxSymbols) return;

                const symbolType = symbolTypes[Math.floor(Math.random() * symbolTypes.length)];

                const symbol = document.createElement('div');
                symbol.className = `symbol ${symbolType}`;

                // Random position anywhere on screen
                symbol.style.left = Math.random() * 90 + '%';
                symbol.style.top = Math.random() * 80 + '%';

                // Random animation delay
                symbol.style.animationDelay = Math.random() * 1 + 's';

                // Consistent animation duration (3-5 seconds)
                symbol.style.animationDuration = (3 + Math.random() * 2) + 's';

                // Some symbols get pulse effect
                if (Math.random() < 0.3) {
                    symbol.classList.add('pulse');
                }

                container.appendChild(symbol);
                symbolCount++;

                // Remove symbol after animation completes
                setTimeout(() => {
                    if (symbol.parentNode) {
                        symbol.parentNode.removeChild(symbol);
                        symbolCount--;
                    }
                }, 5000); // 5 seconds max
            }

            // Create initial symbols
            for (let i = 0; i < 6; i++) {
                setTimeout(() => createSymbol(), i * 300);
            }

            // Continuously create new symbols
            setInterval(() => {
                if (Math.random() < 0.7) { // 70% chance to create a symbol
                    createSymbol();
                }
            }, 1000); // Every 1 second
        });
    </script>

</body>
</html>
